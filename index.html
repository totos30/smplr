<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0b0b0d">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<title>SMPLR</title>
<style>
  :root{
    --bg:#0b0b0d;
    --bg2:#060607;
    --panel:#141418;
    --line:rgba(255,255,255,.07);
    --pad-1:#1d1d23;
    --pad-2:#101014;
    --txt:#ece9e2;
    --muted:#6e6e78;
    --accent:#ff9a2e;
    --accent-2:#ffb55e;
    --accent-soft:rgba(255,154,46,.14);
    --accent-glow:rgba(255,154,46,.55);
    --live:#ff4438;
    --live-glow:rgba(255,68,56,.5);
    --r:18px;
    --gap:clamp(8px,2.2vw,14px);
    font-family:ui-monospace,"Roboto Mono",SFMono-Regular,Menlo,Consolas,monospace;
  }

  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;margin:0;}
  body{
    background:
      radial-gradient(120% 80% at 50% -10%, #16161b 0%, var(--bg) 45%, var(--bg2) 100%);
    color:var(--txt);
    overflow:hidden;
    -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;
    overscroll-behavior:none;
  }
  /* fine grain texture overlay */
  body::after{
    content:"";position:fixed;inset:0;pointer-events:none;z-index:50;opacity:.035;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='120'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='2'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");
    mix-blend-mode:overlay;
  }

  #app{
    height:100dvh;display:flex;flex-direction:column;
    gap:var(--gap);
    padding:calc(env(safe-area-inset-top) + 12px) 12px calc(env(safe-area-inset-bottom) + 12px);
    max-width:560px;margin:0 auto;
  }

  /* ---------- top bar ---------- */
  .bar{
    display:flex;align-items:center;justify-content:space-between;gap:10px;
    height:48px;flex:0 0 auto;
  }
  .brand{display:flex;align-items:center;gap:9px;font-weight:700;letter-spacing:.32em;font-size:15px;}
  .brand .dot{
    width:9px;height:9px;border-radius:50%;background:var(--accent);
    box-shadow:0 0 10px var(--accent-glow);animation:breathe 3.2s ease-in-out infinite;
  }
  @keyframes breathe{0%,100%{opacity:.55;}50%{opacity:1;}}

  .controls{display:flex;align-items:center;gap:8px;}

  .btn{
    border:1px solid var(--line);background:linear-gradient(180deg,#1a1a1f,#121216);
    color:var(--muted);border-radius:12px;height:40px;padding:0 14px;
    font:inherit;font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;
    display:inline-flex;align-items:center;gap:7px;cursor:pointer;
    transition:.18s ease;
  }
  .btn:active{transform:translateY(1px);}
  .btn .ico{width:14px;height:14px;display:block;}

  #editBtn.on{
    color:#0b0b0d;background:linear-gradient(180deg,var(--accent-2),var(--accent));
    border-color:var(--accent);box-shadow:0 0 0 1px var(--accent), 0 6px 20px -8px var(--accent-glow);
  }

  /* segmented mode toggle */
  .seg{display:flex;border:1px solid var(--line);border-radius:12px;overflow:hidden;height:40px;background:#0e0e12;}
  .seg button{
    border:0;background:transparent;color:var(--muted);font:inherit;font-size:11px;font-weight:700;
    letter-spacing:.1em;text-transform:uppercase;padding:0 12px;cursor:pointer;transition:.18s;
  }
  .seg button.on{color:var(--accent);background:var(--accent-soft);box-shadow:inset 0 -2px 0 var(--accent);}

  /* ---------- pad grid ---------- */
  .grid{
    flex:1 1 auto;display:grid;
    grid-template-columns:repeat(4,1fr);
    grid-template-rows:repeat(3,1fr);
    gap:var(--gap);min-height:0;
  }
  .pad{
    position:relative;border-radius:var(--r);
    background:linear-gradient(158deg,var(--pad-1),var(--pad-2));
    border:1px solid var(--line);
    box-shadow:
      inset 0 1px 0 rgba(255,255,255,.06),
      inset 0 -10px 24px -16px #000,
      0 10px 22px -16px #000;
    display:flex;align-items:center;justify-content:center;text-align:center;
    padding:8px;cursor:pointer;touch-action:none;overflow:hidden;
    transition:transform .06s ease, box-shadow .12s ease, border-color .12s ease, opacity .15s;
  }
  .pad .lbl{
    font-size:clamp(11px,3.1vw,14px);font-weight:600;letter-spacing:.04em;color:var(--txt);
    line-height:1.25;word-break:break-word;
  }
  .pad .idx{
    position:absolute;top:8px;left:10px;font-size:9px;font-weight:700;letter-spacing:.1em;
    color:var(--muted);opacity:.6;
  }
  .pad.empty{opacity:.4;cursor:default;}
  .pad.empty .lbl{color:var(--muted);}
  .pad:not(.empty):active{transform:translateY(2px) scale(.985);}

  /* triggered */
  .pad.active{
    border-color:var(--accent);
    background:linear-gradient(158deg,#2a2113,#1a1408);
    box-shadow:
      inset 0 0 0 1px var(--accent),
      0 0 0 1px var(--accent),
      0 0 34px -4px var(--accent-glow),
      inset 0 1px 0 rgba(255,255,255,.12);
  }
  .pad.active .lbl{color:var(--accent-2);text-shadow:0 0 16px var(--accent-glow);}
  .pad.active .idx{color:var(--accent);opacity:.9;}

  /* warming: décodage en cours → shimmer ambré + libellé estompé */
  .pad.warming{cursor:progress;border-color:rgba(255,154,46,.22);}
  .pad.warming .lbl{opacity:.32;}
  .pad.warming .idx{color:var(--accent);opacity:.8;}
  .pad.warming::before{
    content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;
    background:linear-gradient(105deg,transparent 32%,rgba(255,154,46,.20) 50%,transparent 68%);
    background-size:230% 100%;animation:shimmer 1.15s linear infinite;
  }
  @keyframes shimmer{from{background-position:150% 0;}to{background-position:-50% 0;}}

  /* edit affordances */
  body.editing .pad{cursor:pointer;border-style:dashed;border-color:rgba(255,154,46,.35);}
  body.editing .pad.empty{opacity:.6;}
  body.editing .pad .plus{display:block;}
  .pad .plus{display:none;position:absolute;bottom:8px;right:10px;color:var(--accent);font-size:15px;font-weight:700;line-height:1;}

  /* ---------- push to talk ---------- */
  .ptt{
    position:relative;flex:0 0 auto;height:clamp(74px,15vh,108px);
    border-radius:20px;border:1px solid var(--line);
    background:linear-gradient(180deg,#191919,#0e0e10);
    color:var(--txt);font:inherit;font-weight:700;letter-spacing:.28em;font-size:13px;text-transform:uppercase;
    display:flex;align-items:center;justify-content:center;gap:12px;cursor:pointer;touch-action:none;overflow:hidden;
    box-shadow:inset 0 1px 0 rgba(255,255,255,.05), 0 12px 26px -18px #000;
    transition:transform .07s ease,border-color .15s,background .2s;
  }
  .ptt:active{transform:translateY(2px);}
  .ptt .mic{width:18px;height:18px;display:block;color:var(--muted);transition:color .2s;}
  .ptt.live{
    border-color:var(--live);
    background:linear-gradient(180deg,#2a1110,#160807);
    color:#fff;
    box-shadow:0 0 0 1px var(--live), 0 0 40px -4px var(--live-glow);
  }
  .ptt.live .mic{color:var(--live);}
  /* pulsing rings while live */
  .ptt.live::before,.ptt.live::after{
    content:"";position:absolute;left:50%;top:50%;width:60px;height:60px;border-radius:50%;
    transform:translate(-50%,-50%);border:2px solid var(--live);opacity:0;
    animation:ring 1.4s ease-out infinite;
  }
  .ptt.live::after{animation-delay:.7s;}
  @keyframes ring{0%{opacity:.55;width:40px;height:40px;}100%{opacity:0;width:240px;height:240px;}}

  /* ---------- modal ---------- */
  .scrim{
    position:fixed;inset:0;z-index:100;display:none;align-items:center;justify-content:center;padding:18px;
    background:rgba(4,4,6,.7);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  }
  .scrim.show{display:flex;animation:fade .18s ease;}
  @keyframes fade{from{opacity:0;}to{opacity:1;}}
  .sheet{
    width:100%;max-width:380px;background:linear-gradient(180deg,#17171c,#101014);
    border:1px solid var(--line);border-radius:22px;padding:20px;
    box-shadow:0 30px 80px -30px #000;animation:rise .22s cubic-bezier(.2,.8,.2,1);
  }
  @keyframes rise{from{transform:translateY(14px) scale(.98);opacity:0;}to{transform:none;opacity:1;}}
  .sheet h2{margin:0 0 16px;font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);font-weight:700;}
  .field{margin-bottom:14px;}
  .field label{display:block;font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin-bottom:7px;}
  .field input[type=text]{
    width:100%;background:#0c0c0f;border:1px solid var(--line);border-radius:12px;
    color:var(--txt);font:inherit;font-size:15px;padding:13px 14px;outline:none;transition:.15s;
  }
  .field input[type=text]:focus{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent-soft);}

  .filebtn{
    width:100%;border:1px dashed var(--line);background:#0c0c0f;color:var(--txt);
    border-radius:12px;padding:14px;font:inherit;font-size:13px;cursor:pointer;
    display:flex;align-items:center;justify-content:center;gap:10px;transition:.15s;
  }
  .filebtn:active{border-color:var(--accent);}
  .filebtn .fname{color:var(--accent-2);font-size:12px;}
  .filebtn .ico{width:16px;height:16px;color:var(--accent);}

  .row{display:flex;gap:10px;margin-top:18px;}
  .row .btn{flex:1;height:48px;justify-content:center;border-radius:13px;}
  .btn.danger{color:#ff7a70;border-color:rgba(255,68,56,.3);}
  .btn.danger:active{background:rgba(255,68,56,.08);}
  .btn.primary{
    color:#0b0b0d;background:linear-gradient(180deg,var(--accent-2),var(--accent));border-color:var(--accent);
    box-shadow:0 8px 22px -10px var(--accent-glow);
  }

  /* tiny toast */
  .toast{
    position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 26px);transform:translateX(-50%) translateY(20px);
    background:#1c1c22;border:1px solid var(--line);color:var(--txt);font-size:12px;letter-spacing:.04em;
    padding:11px 16px;border-radius:12px;z-index:120;opacity:0;pointer-events:none;transition:.25s;
    box-shadow:0 14px 30px -16px #000;
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
</style>
</head>
<body>
  <div id="app">
    <header class="bar">
      <div class="brand"><span class="dot"></span>SMPLR</div>
      <div class="controls">
        <div class="seg" id="modeSeg">
          <button data-mode="oneshot" class="on">One-shot</button>
          <button data-mode="hold">Hold</button>
        </div>
        <button class="btn" id="editBtn">
          <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>
          <span id="editLbl">Édition</span>
        </button>
      </div>
    </header>

    <main class="grid" id="grid"></main>

    <button class="ptt" id="ptt">
      <svg class="mic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 10a7 7 0 0 0 14 0"/><path d="M12 17v4"/></svg>
      <span id="pttLbl">Push to talk</span>
    </button>
  </div>

  <!-- edit modal -->
  <div class="scrim" id="scrim">
    <div class="sheet" role="dialog" aria-modal="true">
      <h2 id="sheetTitle">Pad</h2>
      <div class="field">
        <label>Libellé</label>
        <input type="text" id="labelInput" maxlength="24" placeholder="Nom du pad" autocomplete="off">
      </div>
      <div class="field">
        <label>Fichier audio</label>
        <button class="filebtn" id="fileBtn">
          <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><path d="m7 8 5-5 5 5"/><path d="M5 21h14"/></svg>
          <span id="fileBtnTxt">Choisir un fichier audio</span>
        </button>
        <input type="file" id="fileInput" accept=".mp3,.wav,.ogg,.m4a,audio/*" hidden>
      </div>
      <div class="row">
        <button class="btn danger" id="clearBtn">Effacer</button>
        <button class="btn primary" id="okBtn">Valider</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

<script>
"use strict";
(() => {
  const PAD_COUNT = 12;
  const LS_PADS = "smplr.pads.v1";
  const LS_MODE = "smplr.mode.v1";

  // ---------- state ----------
  let editMode = false;
  let playMode = localStorage.getItem(LS_MODE) || "oneshot"; // oneshot | hold
  let pads = loadPads();                 // [{label, hasAudio, fileName}]
  let audioCtx = null;
  let currentSource = null, currentEl = null;
  const rawCache = {};                   // idx -> Promise<ArrayBuffer|null>  (préchargé dès le boot)
  const decoded  = {};                   // idx -> Promise<AudioBuffer|null>  (décodé au 1er geste)
  let warmed = false;
  let editingIdx = null;
  let pendingFile = null;                // staged ArrayBuffer in the modal
  let pendingFileName = null;

  // PTT — micro persistant + gate de gain (le flux n'est acquis qu'une fois)
  let micStream = null, micSource = null, micGain = null;
  let pttHeld = false, micPriming = null, micReady = false;

  // ---------- persistence helpers ----------
  function loadPads(){
    try{
      const saved = JSON.parse(localStorage.getItem(LS_PADS));
      if(Array.isArray(saved) && saved.length === PAD_COUNT) return saved;
    }catch(e){}
    return Array.from({length:PAD_COUNT}, () => ({label:"", hasAudio:false, fileName:""}));
  }
  function savePads(){ localStorage.setItem(LS_PADS, JSON.stringify(pads)); }

  // ---------- IndexedDB (audio blobs as ArrayBuffer) ----------
  let dbPromise = null;
  function db(){
    if(dbPromise) return dbPromise;
    dbPromise = new Promise((res, rej) => {
      const req = indexedDB.open("smplr-audio", 1);
      req.onupgradeneeded = () => req.result.createObjectStore("pads");
      req.onsuccess = () => res(req.result);
      req.onerror = () => rej(req.error);
    });
    return dbPromise;
  }
  async function idbPut(idx, buf){
    const d = await db();
    return new Promise((res, rej) => {
      const tx = d.transaction("pads","readwrite");
      tx.objectStore("pads").put(buf, idx);
      tx.oncomplete = res; tx.onerror = () => rej(tx.error);
    });
  }
  async function idbGet(idx){
    const d = await db();
    return new Promise((res, rej) => {
      const req = d.transaction("pads","readonly").objectStore("pads").get(idx);
      req.onsuccess = () => res(req.result || null);
      req.onerror = () => rej(req.error);
    });
  }
  async function idbDel(idx){
    const d = await db();
    return new Promise((res, rej) => {
      const tx = d.transaction("pads","readwrite");
      tx.objectStore("pads").delete(idx);
      tx.oncomplete = res; tx.onerror = () => rej(tx.error);
    });
  }

  // ---------- audio ----------
  async function ensureAudio(){
    if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if(audioCtx.state === "suspended") await audioCtx.resume();
  }

  // Lecture IndexedDB → mise en cache de la Promise (évite les lectures redondantes).
  // Ne nécessite PAS d'AudioContext : peut tourner dès le chargement de la page.
  function getRaw(idx){
    if(!(idx in rawCache)) rawCache[idx] = idbGet(idx).catch(() => null);
    return rawCache[idx];
  }

  // Décodage PCM → mise en cache de la Promise. decodeAudioData détache le buffer,
  // on décode donc une copie (slice) pour garder la source réutilisable.
  // Pendant le décodage, le pad affiche un état « chauffe » (shimmer).
  function getDecoded(idx){
    if(!(idx in decoded)){
      setWarming(idx, true);
      decoded[idx] = getRaw(idx)
        .then(raw => raw ? audioCtx.decodeAudioData(raw.slice(0)) : null)
        .catch(() => null)
        .then(buf => { setWarming(idx, false); return buf; });
    }
    return decoded[idx];
  }

  // Indicateur visuel « chauffe » sur un pad (décodage en cours).
  function setWarming(idx, on){
    const el = grid.children[idx];
    if(el) el.classList.toggle("warming", on);
  }

  // Précharge tous les ArrayBuffers assignés (sans AudioContext) dès le boot.
  function preloadRaw(){ pads.forEach((p, i) => { if(p.hasAudio) getRaw(i); }); }

  // Au tout premier geste : ouvre l'AudioContext et décode tous les pads en parallèle,
  // pour que l'appui sur un pad précis soit ensuite instantané.
  async function warmup(){
    if(warmed) return; warmed = true;
    await ensureAudio();
    pads.forEach((p, i) => { if(p.hasAudio) getDecoded(i); });
  }

  function stopCurrent(){
    if(currentSource){
      try{ currentSource.onended = null; currentSource.stop(); }catch(e){}
      try{ currentSource.disconnect(); }catch(e){}
      currentSource = null;
    }
    if(currentEl){ currentEl.classList.remove("active"); currentEl = null; }
  }

  async function triggerPad(idx, el){
    await ensureAudio();
    const buf = await getDecoded(idx);
    if(!buf) return;
    stopCurrent();                          // monophonie forcée
    const src = audioCtx.createBufferSource();
    src.buffer = buf;
    src.connect(audioCtx.destination);      // → périphérique système (BT inclus)
    src.onended = () => {
      if(currentSource === src){ if(currentEl) currentEl.classList.remove("active"); currentSource = null; currentEl = null; }
    };
    src.start();
    currentSource = src; currentEl = el;
    el.classList.add("active");
    haptic(15);
  }

  function haptic(ms){ if(navigator.vibrate) try{ navigator.vibrate(ms); }catch(e){} }

  // ---------- push-to-talk ----------
  // Acquiert le micro une seule fois et construit le graphe : source → gain(0) → destination.
  // Le flux reste vif entre les appuis ; on n'ouvre/coupe que le gain → réactivité immédiate.
  function primeMic(){
    if(micReady) return Promise.resolve(true);
    if(micPriming) return micPriming;
    micPriming = (async () => {
      await ensureAudio();
      try{
        micStream = await navigator.mediaDevices.getUserMedia({
          audio: {
            // DSP désactivé → latence minimale pour un usage diffusion/talky-walky
            echoCancellation:false, noiseSuppression:false, autoGainControl:false
          }
        });
      }catch(e){
        micPriming = null; toast("Micro refusé"); return false;
      }
      micSource = audioCtx.createMediaStreamSource(micStream);
      micGain = audioCtx.createGain();
      micGain.gain.value = 0;                 // muet au repos, mais le pipeline tourne
      micSource.connect(micGain).connect(audioCtx.destination); // indépendant des pads
      micReady = true; micPriming = null;
      return true;
    })();
    return micPriming;
  }

  async function startPTT(){
    pttHeld = true;
    ptt.classList.add("live");                // retour visuel immédiat, sans attendre le micro
    haptic(20);
    const ok = await primeMic();
    if(!ok){ pttHeld = false; ptt.classList.remove("live"); return; }
    if(!pttHeld) return;                       // relâché avant la fin de l'acquisition
    const t = audioCtx.currentTime;
    micGain.gain.cancelScheduledValues(t);
    micGain.gain.setValueAtTime(micGain.gain.value, t);
    micGain.gain.linearRampToValueAtTime(1, t + 0.004); // ouverture ~4 ms (anti-clic, imperceptible)
  }

  function stopPTT(){
    pttHeld = false;
    ptt.classList.remove("live");
    if(micReady && micGain){
      const t = audioCtx.currentTime;
      micGain.gain.cancelScheduledValues(t);
      micGain.gain.setValueAtTime(micGain.gain.value, t);
      micGain.gain.linearRampToValueAtTime(0, t + 0.006); // fermeture ~6 ms
    }
    // Le flux reste vif → appuis suivants instantanés.
  }

  // Libère complètement le micro (indicateur OS éteint) quand l'app passe en arrière-plan.
  function releaseMic(){
    pttHeld = false; ptt.classList.remove("live");
    if(micSource){ try{ micSource.disconnect(); }catch(e){} micSource = null; }
    if(micGain){ try{ micGain.disconnect(); }catch(e){} micGain = null; }
    if(micStream){ micStream.getTracks().forEach(t => t.stop()); micStream = null; }
    micReady = false; micPriming = null;
  }
  document.addEventListener("visibilitychange", () => { if(document.hidden) releaseMic(); });
  window.addEventListener("pagehide", releaseMic);

  // ---------- rendering ----------
  const grid = document.getElementById("grid");
  function buildGrid(){
    grid.innerHTML = "";
    pads.forEach((p, i) => {
      const el = document.createElement("div");
      el.className = "pad";
      el.dataset.idx = i;
      el.innerHTML = `<span class="idx">${String(i+1).padStart(2,"0")}</span>
                      <span class="lbl"></span><span class="plus">+</span>`;
      grid.appendChild(el);
    });
    renderPads();
  }
  function renderPads(){
    [...grid.children].forEach((el, i) => {
      const p = pads[i];
      el.classList.toggle("empty", !p.hasAudio && !editMode);
      el.querySelector(".lbl").textContent = p.label ? p.label : (!p.hasAudio && !editMode ? "—" : "");
    });
  }

  // ---------- pad interaction (event delegation) ----------
  grid.addEventListener("pointerdown", e => {
    const el = e.target.closest(".pad");
    if(!el) return;
    const idx = +el.dataset.idx;
    if(editMode){ openModal(idx); return; }
    if(!pads[idx].hasAudio) return;
    e.preventDefault();
    triggerPad(idx, el);
  });
  // Hold : couper au relâchement (n'importe où)
  function releaseHold(){ if(playMode === "hold" && !editMode) stopCurrent(); }
  window.addEventListener("pointerup", releaseHold);
  window.addEventListener("pointercancel", releaseHold);

  // ---------- PTT interaction ----------
  const ptt = document.getElementById("ptt");
  ptt.addEventListener("pointerdown", e => {
    if(editMode) return;
    e.preventDefault();
    startPTT();
  });
  window.addEventListener("pointerup", () => { if(pttHeld) stopPTT(); });
  window.addEventListener("pointercancel", () => { if(pttHeld) stopPTT(); });

  // ---------- mode toggle ----------
  const modeSeg = document.getElementById("modeSeg");
  function renderMode(){
    [...modeSeg.children].forEach(b => b.classList.toggle("on", b.dataset.mode === playMode));
  }
  modeSeg.addEventListener("click", e => {
    const b = e.target.closest("button"); if(!b) return;
    playMode = b.dataset.mode; localStorage.setItem(LS_MODE, playMode); renderMode();
    if(playMode === "hold") stopCurrent();
  });
  renderMode();

  // ---------- edit toggle ----------
  const editBtn = document.getElementById("editBtn");
  editBtn.addEventListener("click", () => {
    editMode = !editMode;
    document.body.classList.toggle("editing", editMode);
    editBtn.classList.toggle("on", editMode);
    document.getElementById("editLbl").textContent = editMode ? "Terminé" : "Édition";
    if(editMode) stopCurrent();
    renderPads();
  });

  // ---------- modal ----------
  const scrim = document.getElementById("scrim");
  const labelInput = document.getElementById("labelInput");
  const fileInput = document.getElementById("fileInput");
  const fileBtnTxt = document.getElementById("fileBtnTxt");

  function openModal(idx){
    editingIdx = idx; pendingFile = null; pendingFileName = null;
    const p = pads[idx];
    document.getElementById("sheetTitle").textContent = "Pad " + String(idx+1).padStart(2,"0");
    labelInput.value = p.label || "";
    fileBtnTxt.innerHTML = p.hasAudio
      ? `<span class="fname">${escapeHtml(p.fileName || "Audio chargé")}</span>`
      : "Choisir un fichier audio";
    fileInput.value = "";
    scrim.classList.add("show");
  }
  function closeModal(){ scrim.classList.remove("show"); editingIdx = null; }

  document.getElementById("fileBtn").addEventListener("click", () => fileInput.click());
  fileInput.addEventListener("change", async () => {
    const f = fileInput.files[0]; if(!f) return;
    pendingFile = await f.arrayBuffer();
    pendingFileName = f.name;
    if(!labelInput.value.trim()) labelInput.value = stripExt(f.name).slice(0,24);
    fileBtnTxt.innerHTML = `<span class="fname">${escapeHtml(f.name)}</span>`;
  });

  document.getElementById("okBtn").addEventListener("click", async () => {
    if(editingIdx === null) return;
    const idx = editingIdx;
    if(pendingFile){
      try{ await idbPut(idx, pendingFile); }
      catch(e){ toast("Stockage impossible"); return; }
      delete decoded[idx]; delete rawCache[idx];   // invalider les caches
      pads[idx].hasAudio = true;
      pads[idx].fileName = pendingFileName || "";
      // re-précharge / re-décode immédiatement → pad prêt sans attendre un 1er appui
      getRaw(idx);
      if(audioCtx) getDecoded(idx);
    }
    pads[idx].label = labelInput.value.trim();
    savePads(); renderPads(); closeModal();
  });

  document.getElementById("clearBtn").addEventListener("click", async () => {
    if(editingIdx === null) return;
    const idx = editingIdx;
    await idbDel(idx);
    delete decoded[idx]; delete rawCache[idx];
    pads[idx] = { label:"", hasAudio:false, fileName:"" };
    savePads(); renderPads(); closeModal();
  });

  scrim.addEventListener("pointerdown", e => { if(e.target === scrim) closeModal(); });

  // ---------- utils ----------
  function escapeHtml(s){ return String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c])); }
  function stripExt(n){ return n.replace(/\.[^.]+$/, ""); }
  let toastT;
  function toast(msg){
    const t = document.getElementById("toast");
    t.textContent = msg; t.classList.add("show");
    clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove("show"), 2200);
  }

  // garde-fou : empêche le menu contextuel sur appui long
  window.addEventListener("contextmenu", e => { if(e.target.closest(".pad, .ptt")) e.preventDefault(); });

  // ---------- boot ----------
  buildGrid();
  preloadRaw();                                   // lecture IndexedDB en avance, sans AudioContext
  // 1er geste n'importe où → ouvre l'AudioContext + décode tous les pads (capture = avant le tap pad)
  window.addEventListener("pointerdown", warmup, { once:true, capture:true });

  if("serviceWorker" in navigator){
    window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
  }
})();
</script>
</body>
</html>
